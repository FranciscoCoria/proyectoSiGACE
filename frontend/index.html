<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGACE - Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="login-container">
    <div class="login-card">

      <div class="login-header">
  <div class="sistema-titulo">
    <span class="sigace">SiGACE</span>
    <div class="sistema-descripcion">
      <span>Sistema de Gestión Administrativa para</span>
      <span>Comedores Escolares</span>
    </div>
  </div>

  <div class="escuela-info">
    <img src="img/logo.png" alt="Logo escuela" class="logo-escuela">
    <div class="escuela-datos">
      <span class="escuela-numero">Escuela N° 523</span>
      <span class="escuela-nombre">Domingo F. Sarmiento</span>
    </div>
  </div>
</div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="Ingresá tu usuario" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Ingresá tu contraseña" required>
        </div>

        <div id="errorMsg" class="error-msg"></div>
        
        <button type="submit" class="btn-primary">Ingresar</button>
      </form>
    </div>
  </div>
  
  <script src="js/auth.js"></script>
</body>
</html>
