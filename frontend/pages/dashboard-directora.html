<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGACE - Panel Directora</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <nav class="navbar">
    <span class="navbar-title">SiGACE</span>
    <div class="navbar-user">
      <span id="nombreUsuario"></span>
      <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="container">

    <div class="section-header">
      <h2>Gestión de usuarios</h2>
      <button class="btn-primary" onclick="toggleFormulario(true)">+ Nuevo usuario</button> <!-- hacemos click en el boton y activa el form -->
    </div>

    <div id="formulario" style="display:none;">
      <div class="card">
        <h3 id="formTitulo">Nuevo usuario</h3>
        <input type="hidden" id="usuarioId">
        <form id="usuarioForm">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="nombre" required>
          </div>
          <div class="form-group">
            <label>Apellido</label>
            <input type="text" id="apellido" required>
          </div>
          <div class="form-group">
            <label>Usuario</label>
            <input type="text" id="usuario" required>
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password">
          </div>
          <div class="form-group">
            <label>Rol</label>
            <select id="rol" required>
              <option value="">Selecciona un rol</option>
              <option value="DIRECTORA">Directora</option>
              <option value="ECONOMA">Ecónoma</option>
              <option value="CELADORA">Celadora</option>
            </select>
          </div>
          <div id="errorForm" class="error-msg"></div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Guardar</button>
            <button type="button" onclick="toggleFormulario(false)">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <table class="tabla">
      <thead>
        <tr>
          <th>Nombre y apellido</th>
          <th>Usuario</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaUsuarios">
      </tbody>
    </table>

  </div>

  <script>
    const usuario = JSON.parse(localStorage.getItem('usuario'));
    if (!usuario || usuario.rol !== 'DIRECTORA') {
      window.location.href = '../index.html';
    }
    document.getElementById('nombreUsuario').textContent = usuario.nombre + ' ' + usuario.apellido; 

    function cerrarSesion() {
      localStorage.removeItem('token');
      localStorage.removeItem('usuario');
      window.location.href = '../index.html';
    }
  </script>
  <script src="../js/usuarios.js"></script>

</body>
</html>
