<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGACE - Panel Directora</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <nav class="navbar">
    <span class="navbar-title">SiGACE</span>
    <div class="navbar-user">
      <span id="nombreUsuario"></span>
      <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </nav>
  
  <div class="container">
    <div class="tabs">
    <button class="tab active" onclick="mostrarTab('usuarios', event)">Gestión de usuarios</button>
    <button class="tab" onclick="mostrarTab('planMensual', event)">Plan mensual</button>
    </div>
    

    <div id="tab-usuarios">
      <div class="section-header">
        <h2>Gestión de usuarios</h2>
        <button class="btn-primary" onclick="toggleFormulario(true)">+ Nuevo usuario</button> <!-- hacemos click en el boton y activa el form -->
      </div>
      <div id="errorUsuarios" class="mensaje-advertencia" style="display:none;"></div>
      <div id="formulario" style="display:none;">
        <div class="card">
          <h3 id="formTitulo">Nuevo usuario</h3>
          <input type="hidden" id="usuarioId">
          <form id="usuarioForm">
            <div class="form-group">
              <label>Nombre</label>
              <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
              <label>Apellido</label>
              <input type="text" id="apellido" required>
            </div>
            <div class="form-group">
              <label>Usuario</label>
              <input type="text" id="usuario" required>
            </div>
            <div class="form-group">
              <label>Contraseña</label>
              <input type="password" id="password">
            </div>
            <div class="form-group">
              <label>Rol</label>
              <select id="rol" required>
                <option value="">Selecciona un rol</option>
                <option value="DIRECTORA">Directora</option>
                <option value="ECONOMA">Ecónoma</option>
                <option value="CELADORA">Celadora</option>
              </select>
            </div>
            <div id="errorForm" class="error-msg"></div>
            <div class="form-actions">
              <button type="submit" class="btn-primary">Guardar</button>
              <button type="button" onclick="toggleFormulario(false)">Cancelar</button>
            </div>
          </form>
        </div>
    </div>

    <table class="tabla">
      <thead>
        <tr>
          <th>Nombre y apellido</th>
          <th>Usuario</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaUsuarios">
      </tbody>
    </table>

  </div>
  </div>

  <div id="tab-planMensual" style="display:none;">
  <div id="seccionLista">
    <div class="section-header">
      <h2>Plan mensual</h2>
    </div>
    <div id="listaPlanes"></div>
  </div>

  <div id="seccionPlan" style="display:none;">
    <div class="section-header plan-header directora-plan-header">
  <button class="btn-nuevo" onclick="volverLista()">← Volver</button>

      <div class="plan-titulo">
        <h2 id="tituloPlan"></h2>
        <span id="estadoPlan"></span>
      </div>
    </div>

    <div id="obsDirectora" class="obs-directora" style="display:none;">
      <strong>Observación de la directora:</strong>
      <p id="textoObsDirectora"></p>
    </div>

    <div id="errorPlan" class="error-msg"></div>

    <div class="plan-acciones">
      <button id="btnAprobar" class="btn-primary btn-nuevo" onclick="aprobarPlan()">Aprobar</button>
      <button id="btnObservacion" class="btn-nuevo" onclick="mostrarFormObservacion()">Registrar observación</button>
    </div>

    <div id="seccionObservacion" style="display:none;" class="card">
      <h3>Registrar observación</h3>
      <div class="form-group">
        <label>Observación</label>
        <textarea id="inputObservacion" rows="3" style="width:100%; padding:10px; border:1px solid #c8b5b7; border-radius:4px;"></textarea>
      </div>
      <div id="errorObs" class="error-msg"></div>
      <div class="form-actions">
        <button class="btn-primary" onclick="guardarObservacion()">Guardar</button>
        <button onclick="document.getElementById('seccionObservacion').style.display='none'">Cancelar</button>
      </div>
    </div>

    <div id="grillaPlan" class="grilla-plan"></div>
  </div>
</div>

  <script>
    const usuario = JSON.parse(localStorage.getItem('usuario'));
    if (!usuario || usuario.rol !== 'DIRECTORA') {
      window.location.href = '../index.html';
    }
    document.getElementById('nombreUsuario').textContent = usuario.nombre + ' ' + usuario.apellido; 

    function cerrarSesion() {
      localStorage.removeItem('token');
      localStorage.removeItem('usuario');
      window.location.href = '../index.html';
    }

    function mostrarTab(tab, event) {
  document.getElementById('tab-usuarios').style.display = tab === 'usuarios' ? 'block' : 'none';
  document.getElementById('tab-planMensual').style.display = tab === 'planMensual' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  if (tab === 'planMensual') cargarPlanes();
}
  </script>

<div id="modalConfirm" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center;">
  <div class="card" style="max-width:400px; width:90%; text-align:center;">
    <p id="modalConfirmTexto" style="margin-bottom:16px; font-size:0.95rem; color:#3d3d3d;"></p>
    <div class="confirmar-botones" style="justify-content:center;">
      <button class="btn-eliminar" id="modalConfirmSi">Sí, eliminar</button>
      <button class="btn-cancelar" onclick="cerrarModalConfirm()">Cancelar</button>
    </div>
  </div>
</div>

  <script src="../js/utils.js"></script>
  <script src="../js/usuarios.js"></script>
  <script src="../js/plan.js"></script>

</body>
</html>
